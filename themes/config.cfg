# Enchanted Falcon — Master config
# Copy to /.rockbox/config.cfg on iPod or simdisk
#
# iPod OS feel with Rockbox functionality

# Root menu — iPod-style
root menu order: database, wps, files, playlists, settings

# Boot straight into Music browser
start in screen: db

# Theme
wps: /.rockbox/wps/enchanted-falcon.wps
sbs: /.rockbox/wps/enchanted-falcon.sbs
font: /.rockbox/fonts/18-Adobe-Helvetica.fnt

# Colors — dark mode
foreground color: CCCCCC
background color: 111111
line selector start color: 2D2D30
line selector end color: 2D2D30
line selector text color: 5AC8FA

# Backdrop
backdrop: /.rockbox/backdrops/enchanted-falcon.bmp

# UI settings
selector type: bar (color)
show icons: on
statusbar: off

# Database auto-update
tagcache_autoupdate: on
dircache: on
