# Enchanted Falcon Theme Configuration
# Applied via Settings → Theme Settings → Browse Theme Files

# WPS (Now Playing)
wps: /.rockbox/wps/enchanted-falcon.wps

# Status Bar Skin
#sbs: /.rockbox/wps/enchanted-falcon.sbs

# Colors — dark mode default
foreground color: CCCCCC
background color: 111111
line selector start color: 333333
line selector end color: 333333
line selector text color: FFFFFF

# Font — clean, readable
font: /.rockbox/fonts/20-Inter-Regular.fnt

# Backdrop
backdrop: /.rockbox/backdrops/enchanted-falcon-bg.bmp

# UI
selector type: bar (inverse)
show icons: on
statusbar: custom
