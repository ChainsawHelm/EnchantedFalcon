# Enchanted Falcon Theme
# iPod Classic 7G — 320x240 — Dark Minimal

# Skin files
wps: /.rockbox/wps/enchanted-falcon.wps
sbs: /.rockbox/wps/enchanted-falcon.sbs

# Font — main UI
font: /.rockbox/fonts/18-Adobe-Helvetica.fnt

# Colors — dark mode
foreground color: CCCCCC
background color: 111111
line selector start color: 2D2D30
line selector end color: 2D2D30
line selector text color: 5AC8FA

# Backdrop
backdrop: /.rockbox/backdrops/enchanted-falcon.bmp

# UI settings
selector type: bar (color)
show icons: on
statusbar: off
